app:
  name: "Internal Developer Copilot"
  version: "1.0.0"
  env: "development"
  debug: true
  host: "0.0.0.0"
  port: 8000

# -----------------------------------------------------------------------------
# Logging Configuration (compatible with logging.config.dictConfig)
# -----------------------------------------------------------------------------
logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    json:
      class: "pythonjsonlogger.json.JsonFormatter" # <-- Updated class path
      format: "%(asctime)s %(levelname)s %(name)s %(funcName)s %(message)s"
  handlers:
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "standard"
      stream: "ext://sys.stdout"
    file:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "standard"
      filename: "logs/app.log"
      maxBytes: 10485760 # 10 MB
      backupCount: 5
      encoding: "utf8"
  loggers:
    uvicorn:
      level: "INFO"
      handlers: ["console"]
      propagate: false
    httpx:
      level: "WARNING"
      handlers: ["console"]
      propagate: false
    app:
      level: "DEBUG"
      handlers: ["console", "file"]
      propagate: false
  root:
    level: "INFO"
    handlers: ["console"]

# -----------------------------------------------------------------------------
# Database (PostgreSQL + pgvector / asyncpg)
# -----------------------------------------------------------------------------
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "dev_docs_db"
  driver: "postgresql+asyncpg"
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 1800
  echo: false

# -----------------------------------------------------------------------------
# Redis (Caching & Session Store)
# -----------------------------------------------------------------------------
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  ssl: false
  max_connections: 50
  socket_timeout: 5.0
  default_ttl: 3600

# -----------------------------------------------------------------------------
# Gemini AI Agent & Embeddings
# -----------------------------------------------------------------------------
gemini:
  model: "gemini-3.6-flash"
  embedding_model: "text-embedding-004"
  embedding_dimension: 1536
  temperature: 0.1
  max_output_tokens: 2048

# -----------------------------------------------------------------------------
# RAG Retriever & Guardrails
# -----------------------------------------------------------------------------
rag:
  top_k: 5
  similarity_threshold: 0.75

guardrails:
  max_prompt_length: 2000
  strip_control_characters: true
